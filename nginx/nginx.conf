events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Upstream load-balanced cluster across Docker backend replicas
    upstream collabdesk_backend_cluster {
        least_conn;
        server backend:5000;
        server backend-replica:5000;
    }

    # Redirect HTTP traffic to HTTPS (Production TLS termination)
    server {
        listen 80;
        server_name _;

        # Let's Encrypt ACME challenge endpoint
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Secure TLS/SSL Reverse Proxy Gateway
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL Certificates (mount Let's Encrypt or custom certs into /etc/letsencrypt)
        ssl_certificate /etc/letsencrypt/live/collabdesk/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/collabdesk/privkey.pem;

        # Modern TLS Security Best Practices
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;

        client_max_body_size 12M;

        # REST API Gateway
        location /api/ {
            proxy_pass http://collabdesk_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Full-Duplex WebSockets & Long-Polling Engine
        location /socket.io/ {
            proxy_pass http://collabdesk_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Health Probe
        location / {
            proxy_pass http://collabdesk_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
