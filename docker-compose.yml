services:
  # Primary Backend Node
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: collabdesk-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  # Horizontal Scale Replica (Multi-Instance Clustering Demo)
  backend-replica:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: collabdesk-backend-replica
    restart: unless-stopped
    ports:
      - "5001:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  # Distributed Redis Pub/Sub Message Broker
  redis:
    image: redis:7-alpine
    container_name: collabdesk-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # Production TLS Reverse Proxy & Load Balancer Gateway
  nginx:
    image: nginx:alpine
    container_name: collabdesk-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - backend-replica
    profiles:
      - production
