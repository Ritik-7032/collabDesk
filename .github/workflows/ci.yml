name: CollabDesk CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Integration Tests & Clustering
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6-jammy
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Backend Integration Tests
        working-directory: backend
        env:
          PORT: 5000
          NODE_ENV: test
          MONGO_URI: ${{ secrets.MONGO_URI || 'mongodb://127.0.0.1:27017/collabdesk_ci' }}
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_hermetic_super_secret_jwt_key_12345' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'dummy_gemini_test_key' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || 'dummy_aws_access_key' }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || 'dummy_aws_secret_key' }}
          AWS_REGION: ap-south-1
          AWS_BUCKET_NAME: collabdesk-test-bucket
          RAZORPAY_KEY_ID: rzp_test_dummy
          RAZORPAY_KEY_SECRET: rzp_test_secret_123
        run: npm test

      - name: Run Cross-Instance Redis Adapter Test
        working-directory: backend
        env:
          MONGO_URI: ${{ secrets.MONGO_URI || 'mongodb://127.0.0.1:27017/collabdesk_ci' }}
          REDIS_URL: redis://127.0.0.1:6379
          REQUIRE_REDIS: "true"
          JWT_SECRET: ci_hermetic_super_secret_jwt_key_12345
        run: npm run test:cluster

  frontend-build:
    name: Frontend Build & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Unit Tests
        working-directory: frontend
        run: npm test

      - name: Run Frontend ESLint
        working-directory: frontend
        run: npm run lint

      - name: Build Frontend (Vite)
        working-directory: frontend
        run: npm run build
